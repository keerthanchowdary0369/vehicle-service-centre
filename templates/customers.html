{% extends "base.html" %}
{% block content %}
<h2>Customers</h2>
<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
        </tr>
    </thead>
    <tbody>
        {% for c in customers %}
        <tr>
            <td>{{ c.CustomerID }}</td>
            <td>{{ c.Name }}</td>
            <td>{{ c.Phone }}</td>
            <td>{{ c.Email }}</td>
            <td>{{ c.Address }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<h4 class="mt-5">Add Customer</h4>
<form method="POST" class="mt-3" style="max-width: 500px;">
    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Phone</label>
        <input type="text" name="phone" class="form-control" required maxlength="10">
    </div>
    <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control">
    </div>
    <div class="mb-3">
        <label>Address</label>
        <textarea name="address" class="form-control"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Add Customer</button>
</form>
{% endblock %}
